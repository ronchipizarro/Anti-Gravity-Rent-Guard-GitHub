<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RentGuard Underwriter Dashboard</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: white;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: rgba(0,0,0,0.5);
            border-radius: 12px;
            max-width: 500px;
        }
        h1 { margin-top: 0; color: #fff; }
        p { color: #ccc; margin: 20px 0; }
        .status {
            padding: 20px;
            margin: 20px 0;
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
            font-family: monospace;
        }
        .success {
            color: #4ade80;
            font-weight: bold;
        }
        .loading {
            color: #fbbf24;
            font-weight: bold;
        }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }
        button:hover {
            background: #2563eb;
        }
        button:disabled {
            background: #6b7280;
            cursor: not-allowed;
        }
        .info {
            font-size: 12px;
            color: #999;
            margin-top: 20px;
        }
        .badge {
            display: inline-block;
            background: #ef4444;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Underwriter Dashboard</h1>
        <p>Secure access to underwriting portal...</p>
        <div class="status">
            <span class="loading">Checking ports 3000-3005...</span>
            <div id="ports" style="margin-top: 10px; font-size: 12px; color: #999;"></div>
        </div>
        <button id="btn" disabled>Connecting...</button>
        <div class="info">
            This page auto-detects which port the rentguard-app server is running on.
        </div>
        <div class="badge">⚠️ PASSWORD PROTECTED</div>
    </div>

    <script>
        const ports = [3001, 3000, 3002, 3003, 3004, 3005];
        let foundPort = null;

        async function checkPort(port) {
            try {
                const response = await fetch(`http://localhost:${port}/underwrite`, {
                    method: 'HEAD',
                    mode: 'no-cors'
                });
                return true;
            } catch (e) {
                return false;
            }
        }

        async function findServer() {
            const portsList = document.getElementById('ports');

            for (const port of ports) {
                portsList.innerHTML += `<div>Checking port ${port}...</div>`;
                if (await checkPort(port)) {
                    foundPort = port;
                    document.querySelector('.status').innerHTML =
                        `<span class="success">✓ Found server on port ${port}</span>`;
                    document.getElementById('btn').disabled = false;
                    document.getElementById('btn').textContent = `Open Dashboard (localhost:${port})`;
                    return;
                }
            }

            document.querySelector('.status').innerHTML =
                `<span style="color: #ef4444;">✗ Server not found on any port (3000-3005)</span><br><small>Make sure npm run dev is running</small>`;
            document.getElementById('btn').textContent = 'Server not found';
        }

        document.getElementById('btn').addEventListener('click', () => {
            if (foundPort) {
                window.location.href = `http://localhost:${foundPort}/underwrite`;
            }
        });

        // Auto-redirect if server is already found
        findServer().then(() => {
            if (foundPort) {
                setTimeout(() => window.location.href = `http://localhost:${foundPort}/underwrite`, 1000);
            }
        });
    </script>
</body>
</html>
